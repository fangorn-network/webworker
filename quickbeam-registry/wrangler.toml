name = "quickbeam-registry"
main = "src/index.js"
compatibility_date = "2025-01-01"

workers_dev = true
preview_urls = false

# ── Domains ──────────────────────────────────────────────────────────────────
# The zone is already on Cloudflare, so a custom domain plus a WILDCARD gives every
# view a branded HTTPS URL with no DNS call and no certificate per view — Cloudflare
# holds both. `qb-147c24c5-music.qb.sond3r.com/search` is the same request as
# `/q/qb_147c24c5_music/search`; the worker resolves the view from the Host header.
#
# Uncomment once the zone is attached to this account. A wildcard route needs a
# proxied `*.qb` DNS record (or Cloudflare for SaaS) on the zone.
# [[routes]]
# pattern = "quickbeam.sond3r.com"
# custom_domain = true
#
# [[routes]]
# pattern = "*.qb.sond3r.com/*"
# zone_name = "sond3r.com"

# ── Config guard ─────────────────────────────────────────────────────────────
# Runs before every `wrangler deploy`/`dev`; a non-zero exit aborts. The contract
# address comes from the installed Fangorn SDK rather than from this file, so the guard
# checks the SDK: refuses to ship if the installed version carries no well-formed
# subscriptionRegistryContractAddress. The worker must never gate on a fallback/wrong
# contract.
[build]
command = "node -e \"const {FangornConfig:c}=await import('@fangorn-network/sdk/lib/config.js');if(!/^0x[0-9a-fA-F]{40}$/.test(c.subscriptionRegistryContractAddress||''))throw new Error('SDK has no valid subscriptionRegistryContractAddress; upgrade @fangorn-network/sdk');console.log('gate contract (from SDK):',c.subscriptionRegistryContractAddress)\" --input-type=module"

[vars]
# ── Entitlement ──────────────────────────────────────────────────────────────
# access(address) on the SubscriptionRegistry returns (registered, paidAt) in one
# call: `registered` is its cross-contract check against the DataRegistry, `paidAt`
# the wallet's last subscription payment. An active subscription is the entitlement
# for Quickbeam monitoring — there is no separate Quickbeam contract.
#
# The address is NOT set here. It comes from @fangorn-network/sdk (FangornConfig), the
# only thing that knows which SubscriptionRegistry pairs with which DataRegistry — a
# stale pairing reads as "unregistered" for every wallet registered after a redeploy
# and rejects every view. Move deployments by bumping the SDK, then redeploying this
# worker and pinata-url-provider, which reads the same value.
#
# SUBSCRIPTION_CONTRACT_ADDRESS still works as an emergency override (repointing ahead
# of an SDK publish) and logs a warning naming what it replaced. If you set it, verify
# the pairing first:
#   cast call <address> "dataRegistry()(address)" --rpc-url https://sepolia-rollup.arbitrum.io/rpc
# must equal FangornConfig.dataRegistryContractAddress.
#
# EVM JSON-RPC endpoint. Defaults to the SDK's (the public Arbitrum Sepolia RPC), which
# is fine for this read-only call; set your own for higher rate limits.
# RPC_URL = "https://sepolia-rollup.arbitrum.io/rpc"
ACCESS_FUNCTION = "access(address)"

# The subscription is active for this many days after payment. Lives here, not
# on-chain, so it is tunable without a contract redeploy. Keep in sync with the
# storage worker and the website's display constant.
SUBSCRIPTION_WINDOW_DAYS = "30"

# "true" skips the on-chain check entirely — a valid signature alone is enough.
# For local dev only.
STUB_GATE = "false"

# Shown in the 403 / 402 responses so callers know what to do next.
REGISTER_URL = "https://fangorn.network"
SUBSCRIBE_URL = "https://fangorn.network"

# ── Teardown ─────────────────────────────────────────────────────────────────
# Comma-separated wallets allowed to call /admin/remove and /admin/list. Nothing
# expires on its own: a founder removes a source and the instance drops it within
# one poll.
ADMIN_WALLETS = "0x147c24c5Ea2f1EE1ac42AD16820De23bBba45Ef6"

# Soft cap on views per wallet — an abuse guard, not an entitlement. A view is cheap
# (embedding is deduplicated across views), so this can be generous. "0" disables it.
MAX_VIEWS_PER_WALLET = "5"

# Cosmetic: quoted back in the /views response so the user knows how long to wait.
# Match the instance's --sources-refresh.
POLL_HINT_SECONDS = "60"

# ── Instance endpoints (the query proxy) ─────────────────────────────────────
# The shared Quickbeam box. Plain HTTP is fine: browsers reach these through this
# worker, which supplies TLS — so the box needs no certificate.
#
# ⚠️ It DOES need a hostname. A Worker's fetch() to a raw IP is refused by Cloudflare
# with error 1003 ("Direct IP Access Not Allowed"), and since that is a response rather
# than a connection error, the proxy forwards the error page instead of a clean 502.
# Use a DNS-ONLY (grey cloud) A record: a proxied one re-enters Cloudflare, which
# carries 8080 but not 8090, so the CDN half would fail while search looked fine.
#
# There is no MCP_URL: a requester's MCP is their own local `quickbeam mcp` client
# pointed at /q/{viewId}/cdn, whose catalog this worker filters to their namespaces.
# Nothing MCP-shaped is provisioned per requester.
SEARCH_URL = "http://qb.sond3r.com:8080"
CDN_URL = "http://qb.sond3r.com:8090"

# How long the instance may take to ANSWER before a proxied request is a 502. Bounds
# the wait for headers only — /stream (SSE) and /export keep streaming afterwards for
# as long as they like.
#
# A box that is off, or a firewall that DROPs rather than refuses, black-holes the SYN:
# without this the request hangs until Cloudflare kills it near 100s, and the caller is
# told "the endpoint timed out" about the wrong hop entirely. 502 "Instance unreachable"
# in 15s names the real one.
INSTANCE_TIMEOUT_MS = "15000"

# ── App scoping ──────────────────────────────────────────────────────────────
# A source is the whole app:publisher:subspace triple. Apps are stored canonically as
# their 32-byte id (keccak256 of the name, the SDK's toAppId) — the website only ever
# has the id, since it reads apps out of StateCommitted topics, which carry no name.
# Either form is accepted on input; a name is hashed on the way in.
#
# This is the app assumed for a source that names none — i.e. every view written before
# the app dimension existed. It MUST be the app those views were created against, or
# they resolve to a CDN domain the watcher never bakes and their catalogs come back
# empty. "fangorn" is the SDK's DEFAULT_APP, which is what the website stamped
# (APP_ID = toAppId(DEFAULT_APP)) on every view created through it so far.
DEFAULT_APP = "fangorn"

# Per-view subdomains live under this suffix. Leave EMPTY to serve views only at
# /q/{viewId}/… on the worker's own hostname; set it once the wildcard route above is
# live and every view's advertised URL becomes its own subdomain.
VIEW_DOMAIN_SUFFIX = ""

# ── Hosted MCP (optional) ────────────────────────────────────────────────────
# When a requester ticks "host an MCP for me", the worker runs one Cloud Run service
# per view: the same quickbeam image, `mcp --cdn-url <that view's filtered catalog>`.
# An MCP is stateless, holds no connections and needs no disk, so it scales to zero
# and an idle user's MCP costs nothing — the opposite of the watcher, which is why
# that one lives on a VM instead.
#
# Leave these unset to disable the feature: the checkbox then returns a clear
# "not configured" error and the view still gets its search endpoint.
#
# The service account needs roles/run.admin and roles/iam.serviceAccountUser.
# GCP_PROJECT = "your-project"
# GCP_REGION = "us-central1"
# GCP_SA_EMAIL = "quickbeam-registry@your-project.iam.gserviceaccount.com"
# QUICKBEAM_IMAGE = "us-central1-docker.pkg.dev/your-project/quickbeam/quickbeam:latest"
#
# Secret (do NOT put in [vars]) — the `private_key` field of the service-account JSON:
#   wrangler secret put GCP_SA_KEY

# ── Address-ownership proof ──────────────────────────────────────────────────
SIGNATURE_MAX_AGE = "300"

# CORS — browsers only, not an access gate. The signed proof is.
ALLOWED_ORIGIN = "*"

# KV holding one row per watched source. Create it once, then paste the id:
#   wrangler kv namespace create QUICKBEAM_KV
[[kv_namespaces]]
binding = "QUICKBEAM_KV"
id = "d37a0a0747364fbcb20fd5020cb64a69"
