name = "pinata-url-provider"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ── Deployment routing ───────────────────────────────────────────────────────
# Set explicitly so `wrangler deploy` doesn't fall back to defaults (and warn).
# Keep the worker's *.workers.dev URL, but disable per-version Preview URLs.
# Using a custom domain/route instead? Set workers_dev = false.
workers_dev = true
preview_urls = false

# ── Config guard ─────────────────────────────────────────────────────────────
# Runs before every `wrangler deploy`/`dev`; a non-zero exit aborts. The contract
# addresses come from the installed Fangorn SDK rather than from this file, so the
# guard checks the SDK: it refuses to ship if the installed version does not carry a
# well-formed dataRegistryContractAddress *and* appRegistryContractAddress. The worker
# must never silently gate access on a fallback/wrong contract.
[build]
command = "node -e \"const {FangornConfig:c}=await import('@fangorn-network/sdk/lib/config.js');for(const k of ['dataRegistryContractAddress','appRegistryContractAddress'])if(!/^0x[0-9a-fA-F]{40}$/.test(c[k]||''))throw new Error('SDK has no valid '+k+'; upgrade @fangorn-network/sdk');console.log('gate contracts (from SDK):',c.dataRegistryContractAddress,c.appRegistryContractAddress)\" --input-type=module"

# ── Public (non-secret) configuration ────────────────────────────────────────
# Edit these to point at your registry. The only secret is PINATA_JWT — set it
# with `wrangler secret put PINATA_JWT` (or .dev.vars locally).
[vars]
# ── Access check ─────────────────────────────────────────────────────────────
# Two reads per request, both against contracts named by @fangorn-network/sdk
# (FangornConfig) and NOT set here:
#
#   DataRegistry.getPublisherStatus(caller)   the wallet's network-wide standing
#   AppRegistry.access(appId, caller)         → (registered, owner, paidAt)
#
# `appId` is the caller's, or the SDK's default app when they send none. `registered`
# is the same per-app membership DataRegistry.commitStateRoot enforces: false unless
# the app's owner added the wallet and it accepted the current terms, and false for a
# suspended app or publisher. `paidAt` is when the APP last paid its subscription —
# an app is a subscription, and every upload is billed to the app it lands in.
#
# The SDK is the only thing that knows which contracts belong together, so there is no
# address override: move deployments by bumping the SDK, then redeploying this worker.
#
# EVM JSON-RPC endpoint. Defaults to the SDK's (the public Arbitrum Sepolia RPC), which
# is fine for these read-only calls; set your own (e.g. Alchemy) for higher rate limits.
# RPC_URL = "https://sepolia-rollup.arbitrum.io/rpc"

# Every upload needs the app's subscription to be active: paid (claimed or renewed)
# within SUBSCRIPTION_WINDOW_DAYS. The contract stores only the timestamp; the window
# math happens here, so it is tunable without a contract redeploy. There is no free tier.
SUBSCRIPTION_WINDOW_DAYS = "30"

# "true" skips the on-chain check entirely: a valid ownership signature alone
# yields a presigned URL. Handy for local dev/testing without an RPC endpoint.
# Leave "false" (or unset) in production.
STUB_REGISTRATION_CHECK = "false"

# Shown in the "not registered" error so callers know where to register.
REGISTER_URL = "https://fangorn.network"

# Shown in the inactive-subscription (402) error so the app owner knows where to renew.
SUBSCRIBE_URL = "https://fangorn.network"

# ── Address-ownership proof ──────────────────────────────────────────────────
# Callers must sign a challenge message with the address's key and send
# { message, signature } so the worker can prove they control the address (not
# just that some registered address exists). Always enforced. See examples/.
SIGNATURE_MAX_AGE = "300"       # max age in seconds of the signed challenge's Issued-At

# ── Pinata presigned upload URL settings ─────────────────────────────────────
PINATA_NETWORK = "public"        # "public" or "private"
PINATA_URL_EXPIRES = "300"       # seconds the upload URL stays valid
# Per-upload ceiling (bytes). The SDK declares the exact size it needs and the
# worker mints a URL scoped to it; this only caps how large any single request
# may be, so nobody can mint a URL for an absurd file. Unset → 500 MiB default.
MAX_UPLOAD_SIZE = "524288000"    # 500 MiB
# Fangorn uploads opaque binary (CAR packfiles + raw commit blocks) as
# octet-stream, and serialized payloads as text/plain — so allow exactly those.
# Widen or unset to permit more MIME types.
PINATA_ALLOW_MIME_TYPES = "application/octet-stream,text/plain"  # optional CSV
# Every presigned URL is scoped to a Pinata group named "<prefix>:<appId>:<wallet>"
# — one group per wallet per app, namespaced by deployment — so a whole deployment's
# (or one app's) pins can be
# swept later (list groups by this prefix, unpin their files). REQUIRED: a mint
# that can't resolve its group fails rather than pinning where no cleanup job can
# find it. This deployment is testnet; production is a separate worker deploy with
# its own prefix.
PINATA_GROUP_PREFIX = "testnet"

# CORS — browsers only. This restricts which *web pages* may read the response
# from their JavaScript; it is NOT an access-control gate and does NOT affect
# CLI/curl/server callers (they ignore CORS). Access is gated by the signed
# ownership proof regardless. Use "*" to allow any browser origin, or a
# comma-separated allowlist to lock it to your site(s), e.g.
#   ALLOWED_ORIGIN = "https://fangorn.network,https://app.fangorn.network"
ALLOWED_ORIGIN = "*"

# ── Per-app abuse cap (Workers KV) ───────────────────────────────────────────
# The SDK declares each upload's size, so the cap is a per-app daily *byte budget*:
# the sum of granted upload sizes across all of an app's publishers per UTC day. Set
# "0" (or unset) to disable. Requires the RATE_KV namespace binding below.
DAILY_BYTE_LIMIT = "1073741824"   # 1 GiB / app / day

# Secret to set (do NOT put this in [vars]):
#   wrangler secret put PINATA_JWT   # Pinata key with Files:Write AND Groups:Write

# KV namespace backing the per-app cap and the group-id cache. Create it once, then paste the id:
#   wrangler kv namespace create RATE_KV
[[kv_namespaces]]
binding = "RATE_KV"
id = "524161f052814fe3a809d8d0f0a14c6a"  # arb_sep_kv
