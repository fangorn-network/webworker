# Base Sepolia's upload worker: https://pinata-url-provider-base.fangorn-0be.workers.dev
# NEVER rename this back to "pinata-url-provider". That name is the live Arbitrum
# worker, which apps on the Arbitrum deployments still use; its code predates this
# repo, so overwriting it cannot be undone.
name = "pinata-url-provider-base"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ── Deployment routing ───────────────────────────────────────────────────────
# Set explicitly so `wrangler deploy` doesn't fall back to defaults (and warn).
# Keep the worker's *.workers.dev URL, but disable per-version Preview URLs.
# Using a custom domain/route instead? Set workers_dev = false.
workers_dev = true
preview_urls = false

# ── Public (non-secret) configuration ────────────────────────────────────────
# The only secret is PINATA_JWT — set it with `wrangler secret put PINATA_JWT`
# (or .dev.vars locally).
[vars]
# ── Address-ownership proof ──────────────────────────────────────────────────
# Callers must sign a challenge message with the address's key and send
# { message, signature }, so quotas are charged to an address the caller controls.
# Always enforced. See examples/.
SIGNATURE_MAX_AGE = "300"       # max age in seconds of the signed challenge's Issued-At

# ── Pinata presigned upload URL settings ─────────────────────────────────────
PINATA_NETWORK = "public"        # "public" or "private"
PINATA_URL_EXPIRES = "300"       # seconds the upload URL stays valid
# Per-upload ceiling (bytes). The SDK declares the exact size it needs and the
# worker mints a URL scoped to it; this only caps how large any single request
# may be, so nobody can mint a URL for an absurd file. Unset → 500 MiB default.
MAX_UPLOAD_SIZE = "524288000"    # 500 MiB
# Fangorn uploads opaque binary (CAR packfiles + raw commit blocks) as
# octet-stream, and serialized payloads as text/plain — so allow exactly those.
# Widen or unset to permit more MIME types.
PINATA_ALLOW_MIME_TYPES = "application/octet-stream,text/plain"  # optional CSV
# Every presigned URL is scoped to a Pinata group named "<prefix>:<wallet>" — one
# group per wallet, namespaced by deployment — so a deployment's (or one
# publisher's) pins can be swept later. REQUIRED: a mint that can't resolve its
# group fails rather than pinning where no cleanup job can find it. Production is a
# separate worker deploy with its own prefix.
PINATA_GROUP_PREFIX = "testnet-base"

# CORS — browsers only. This restricts which *web pages* may read the response
# from their JavaScript; it is NOT an access-control gate and does NOT affect
# CLI/curl/server callers (they ignore CORS). Access is gated by the signed
# ownership proof regardless. Use "*" to allow any browser origin, or a
# comma-separated allowlist to lock it to your site(s), e.g.
#   ALLOWED_ORIGIN = "https://fangorn.network,https://app.fangorn.network"
ALLOWED_ORIGIN = "*"

# ── Quotas (Workers KV) ──────────────────────────────────────────────────────
# Daily byte quotas: per publisher, and for the whole worker, which bounds the
# Pinata bill however many wallets ask. "0" (or unset) disables either. Requires
# the RATE_KV namespace binding below.
DAILY_BYTE_LIMIT = "1073741824"         # 1 GiB / publisher / day
GLOBAL_DAILY_BYTE_LIMIT = "21474836480" # 20 GiB / day, everyone together

# Refuse an address:  wrangler kv key put --binding RATE_KV "deny:<lowercase address>" 1

# Secret to set (do NOT put this in [vars]):
#   wrangler secret put PINATA_JWT   # Pinata key with Files:Write AND Groups:Write

# KV namespace backing the quotas, the denylist and the group-id cache. Create it once, then paste the id:
#   wrangler kv namespace create RATE_KV
[[kv_namespaces]]
binding = "RATE_KV"
# Created 2026-10-22 for pinata-url-provider-base.
id = "ba8e021b025e40a5a57194a79b756fad"
