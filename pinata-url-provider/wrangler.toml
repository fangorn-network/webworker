# Base Sepolia's upload worker: https://pinata-url-provider-base.fangorn-0be.workers.dev
# NEVER rename this back to "pinata-url-provider". That name is the live Arbitrum
# worker, which apps on the Arbitrum deployments still use; its code predates this
# repo, so overwriting it cannot be undone.
name = "pinata-url-provider-base"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ── Deployment routing ───────────────────────────────────────────────────────
# Set explicitly so `wrangler deploy` doesn't fall back to defaults (and warn).
# Keep the worker's *.workers.dev URL, but disable per-version Preview URLs.
# Using a custom domain/route instead? Set workers_dev = false.
workers_dev = true
preview_urls = false

# ── Config guard ─────────────────────────────────────────────────────────────
# Runs before every `wrangler deploy`/`dev`; a non-zero exit aborts. The contract
# address comes from the installed Fangorn SDK (BaseSepoliaConfig) rather than from
# this file, so the guard checks the SDK: it refuses to ship if the installed version
# does not carry a well-formed Base Sepolia appRegistryContractAddress. The worker must
# never silently gate access on a fallback/wrong contract.
[build]
command = "node -e \"const {BaseSepoliaConfig:c}=await import('@fangorn-network/sdk/lib/config.js');if(!/^0x[0-9a-fA-F]{40}$/.test(c?.appRegistryContractAddress||''))throw new Error('SDK has no valid Base Sepolia appRegistryContractAddress; upgrade @fangorn-network/sdk');console.log('gate contract (from SDK, Base Sepolia):',c.appRegistryContractAddress)\" --input-type=module"

# ── Public (non-secret) configuration ────────────────────────────────────────
# Edit these to point at your registry. The only secret is PINATA_JWT — set it
# with `wrangler secret put PINATA_JWT` (or .dev.vars locally).
[vars]
# ── Access check ─────────────────────────────────────────────────────────────
# Two reads per granted request, made together, against Base Sepolia's AppRegistry as
# named by @fangorn-network/sdk (BaseSepoliaConfig) and NOT set here:
#
#   AppRegistry.access(appId, caller)   → (canPublish, owner, expiresAt)
#   AppRegistry.canonicalAppId(appId)   → the id the app was claimed under
#
# A renamed app answers to every id it went by; the byte budget and Pinata groups are
# keyed by the canonical id, so an alias can't open a budget of its own.
#
# `appId` is required: every upload is billed to the app it names. `canPublish` is the
# contract's single rule: the app is claimed, not taken down and not expired (expiry is
# enforced on-chain), the wallet is not banned network-wide, and the app's owner has
# accepted it and not suspended it. A denial is explained with a few more reads.
#
# The SDK is the only thing that knows which contracts belong together, so there is no
# address override: move deployments by bumping the SDK, then redeploying this worker.
#
# Base Sepolia JSON-RPC endpoint. Defaults to the SDK's public one, which is fine for
# these read-only calls; set your own (e.g. Alchemy) for higher rate limits.
# RPC_URL = "https://base-sepolia-rpc.publicnode.com"

# Shown in the expired-subscription (402) error so the app owner knows where to renew.
SUBSCRIBE_URL = "https://fangorn.network"

# ── Address-ownership proof ──────────────────────────────────────────────────
# Callers must sign a challenge message with the address's key and send
# { message, signature } so the worker can prove they control the address (not
# just that some registered address exists). Always enforced. See examples/.
SIGNATURE_MAX_AGE = "300"       # max age in seconds of the signed challenge's Issued-At

# ── Pinata presigned upload URL settings ─────────────────────────────────────
PINATA_NETWORK = "public"        # "public" or "private"
PINATA_URL_EXPIRES = "300"       # seconds the upload URL stays valid
# Per-upload ceiling (bytes). The SDK declares the exact size it needs and the
# worker mints a URL scoped to it; this only caps how large any single request
# may be, so nobody can mint a URL for an absurd file. Unset → 500 MiB default.
MAX_UPLOAD_SIZE = "524288000"    # 500 MiB
# Fangorn uploads opaque binary (CAR packfiles + raw commit blocks) as
# octet-stream, and serialized payloads as text/plain — so allow exactly those.
# Widen or unset to permit more MIME types.
# Optional CSV. Pinata checks the type it DETECTS from the bytes, not the one the uploader declares: the SDK
# sends records and ERC-8004 registration files as "text/plain", but they are JSON, detected as application/json.
PINATA_ALLOW_MIME_TYPES = "application/octet-stream,text/plain,application/json"
# Every presigned URL is scoped to a Pinata group named "<prefix>:<appId>:<wallet>"
# — one group per wallet per app, namespaced by deployment — so a whole deployment's
# (or one app's) pins can be swept later (list groups by this prefix, unpin their
# files). REQUIRED: a mint that can't resolve its group fails rather than pinning
# where no cleanup job can find it. "testnet-base" because "testnet" holds the pins
# of the Arbitrum-era apps, and an app id is a hashed name: a Base app and an
# Arbitrum app of the same name must not share a group. Production is a separate
# worker deploy with its own prefix.
PINATA_GROUP_PREFIX = "testnet-base"

# CORS — browsers only. This restricts which *web pages* may read the response
# from their JavaScript; it is NOT an access-control gate and does NOT affect
# CLI/curl/server callers (they ignore CORS). Access is gated by the signed
# ownership proof regardless. Use "*" to allow any browser origin, or a
# comma-separated allowlist to lock it to your site(s), e.g.
#   ALLOWED_ORIGIN = "https://fangorn.network,https://app.fangorn.network"
ALLOWED_ORIGIN = "*"

# ── Per-app abuse cap (Workers KV) ───────────────────────────────────────────
# The SDK declares each upload's size, so the cap is a per-app daily *byte budget*:
# the sum of granted upload sizes across all of an app's publishers per UTC day. Set
# "0" (or unset) to disable. Requires the RATE_KV namespace binding below.
DAILY_BYTE_LIMIT = "1073741824"   # 1 GiB / app / day

# Secret to set (do NOT put this in [vars]):
#   wrangler secret put PINATA_JWT   # Pinata key with Files:Write AND Groups:Write

# KV namespace backing the per-app cap and the group-id cache. Create it once, then paste the id:
#   wrangler kv namespace create RATE_KV
[[kv_namespaces]]
binding = "RATE_KV"
# Its own namespace, not the Arbitrum worker's (524161f0…): app ids are hashed names,
# so an app of the same name on both chains would otherwise share one daily budget.
# Created 2026-10-22 for pinata-url-provider-base.
id = "ba8e021b025e40a5a57194a79b756fad"
