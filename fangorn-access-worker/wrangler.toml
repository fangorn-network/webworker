name = "fangorn-access-worker"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "my-first-bucket"

[vars]
# The SettlementRegistry and the RPC endpoint come from @fangorn-network/sdk
# (FangornConfig), the only thing that knows which contracts belong to the current
# deployment — checking a retired registry answers `isSettled: false` for every buyer
# who paid on the live one. Move deployments by bumping the SDK, then redeploying.
#
# Both vars below remain as overrides for repointing ahead of an SDK publish; taking
# the address override logs a warning naming what it replaced.
# SETTLEMENT_REGISTRY_ADDRESS = "0x480d54411d77820701fd80f42b81fb6e20176d12"
# ARBITRUM_SEPOLIA_RPC = "https://sepolia-rollup.arbitrum.io/rpc"
TIMESTAMP_WINDOW = "60"

[observability]
enabled = true
head_sampling_rate = 1