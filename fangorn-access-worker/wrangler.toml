name = "fangorn-access-worker"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fttf"

[vars]
# WORKER_X25519_SECRET is a secret, set via `wrangler secret put WORKER_X25519_SECRET`
SETTLEMENT_REGISTRY_ADDRESS = "0xec43a354e1b375585e58ae1e6b02954f84139feb"
ARBITRUM_SEPOLIA_RPC = "https://sepolia-rollup.arbitrum.io/rpc"
TIMESTAMP_WINDOW = "60"

[observability]
enabled = true
head_sampling_rate = 1